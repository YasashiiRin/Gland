[package]
name = "farm-game"
version = "0.15.0"
description = "Vuon Nha Nho - a small original farming sim"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "farm_game_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "farm-game"
path = "src/main.rs"
