<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Làng Việt</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1b1f17;
        overflow: hidden;
        /* Stop the browser from starting a native text/image drag-select
           while the player is holding a movement key and moving the mouse —
           that drag operation was swallowing keyup events, making the
           character "stick" or stop responding to keys mid-drag. */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        /* Phones: no pinch-zoom / pull-to-refresh / double-tap zoom while playing. */
        touch-action: none;
        overscroll-behavior: none;
      }
      /* Fill only what is really visible: inside the notch / home-bar safe areas
         and under (not behind) the phone browser's toolbars (dvh). */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      @supports not (inset: 0) {
        #game { width: 100vw; height: 100vh; }
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -webkit-user-drag: none;
        user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Belt-and-suspenders: some browsers still start a native drag on
      // mousedown+move over a canvas even with the CSS above.
      document.addEventListener('dragstart', (e) => e.preventDefault());
      document.addEventListener('selectstart', (e) => e.preventDefault());
    </script>
  </body>
</html>
